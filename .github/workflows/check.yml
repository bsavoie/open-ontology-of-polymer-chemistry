name: Portable reader and contracts
# The repository is private, so every minute counts against the account's
# Actions quota. Pushes run the test suite on Ubuntu; pull requests and manual
# runs (Actions -> Run workflow) also check the installed package on macOS and
# Windows. Run the full suite locally before merging, as AGENTS.md requires.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The seed release first, so tests that read it (the about page's figures) run here too.
      - run: python -m oopc import-seed data/wiki-snapshot-v2.json
      - run: python tools/run_tests.py --workers 4
      - run: npm run check
      - run: python -m oopc verify
      - run: python -m oopc loop status
  rdf-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[validation]'
      - run: python -m unittest discover -s tests -p 'test_scientific_model.py'

  installed-distribution:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes count about 10x and Windows about 2x against the capped
        # budget, so pushes check the installed package on Ubuntu only; pull
        # requests and manual runs cover all three systems.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p "test_storage_portability.py"
      - run: python -m unittest discover -s tests -p "test_mcp_portability.py"
      - run: python -m pip install build "setuptools>=77"
      - run: python -m build
      - run: python tools/check_distribution.py dist
