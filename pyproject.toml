[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ontology-of-polymer-chemistry"
version = "0.12.0"
description = "Portable polymer evidence graphs, agent research, and observable task replay"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA", "LICENSE-CONTENT", "NOTICE"]
dependencies = []

[project.optional-dependencies]
validation = ["rdflib>=7,<8", "pyshacl>=0.30,<1"]
test = ["pytest>=8,<9"]

[project.scripts]
oopc = "oopc.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["oopc*"]

[tool.setuptools.package-data]
oopc = ["web/index.html", "web/researcher.js", "web/researcher.css", "web/operator.html", "web/app.js", "web/style.css", "web/about.html", "web/about.css", "web/about.js", "web/about/*.svg", "web/vendor/cytoscape.min.js", "web/vendor/cytoscape.LICENSE", "web/vendor/openchemlib.js", "web/vendor/openchemlib.LICENSE", "schema/*.json"]
