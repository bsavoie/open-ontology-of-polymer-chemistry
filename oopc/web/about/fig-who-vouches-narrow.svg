<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 612" role="group" class="fig"><title>Who vouches for a fact</title><desc>A new finding is either added, when the research agent read it directly in the source, or marked needs checking, when it was unsure or the excerpt lacks the number. A reviewer opens the source for every finding that needs checking and for a one-in-five sample of added ones, and labels each reviewed, needs checking (could not confirm) or rejected (hidden from search, with the reason kept). Added findings that are not sampled stay added. Imported seed content is a separate lane: source-backed, never shown as reviewed.</desc><rect x="110" y="10" width="140" height="36" rx="18" class="card"/><text x="180" y="33" class="lbl lbl-strong term" text-anchor="middle" data-term="finding">New finding</text><path d="M180 46V64H50V90" class="edge"/><path d="M47 84.8L50 90L53 84.8" class="edge"/><path d="M180 64H262.4V90" class="edge"/><path d="M259.4 84.8L262.4 90L265.4 84.8" class="edge"/><rect x="16" y="96" width="68" height="24" rx="12" class="badge-shape s-added"/><circle cx="29" cy="108" r="3.5" class="badge-dot s-added"/><text x="38" y="112.3" class="lbl badge-text s-added term" data-term="added">Added</text><text x="18" y="138" class="lbl lbl-xs muted">read directly in</text><text x="18" y="152" class="lbl lbl-xs muted">the source</text><rect x="196" y="96" width="132.8" height="24" rx="12" class="badge-shape s-checking"/><circle cx="209" cy="108" r="3.5" class="badge-dot s-checking"/><text x="218" y="112.3" class="lbl badge-text s-checking term" data-term="needs-checking">Needs checking</text><text x="198" y="138" class="lbl lbl-xs muted">unsure, or the excerpt</text><text x="198" y="152" class="lbl lbl-xs muted">lacks the number</text><rect x="196" y="206" width="148" height="52" rx="10" class="card"/><text x="270" y="229" class="lbl lbl-strong term" text-anchor="middle" data-term="reviewer">Reviewer</text><text x="270" y="246" class="lbl lbl-xs muted" text-anchor="middle">opens the source</text><line x1="262.4" y1="166" x2="262.4" y2="200" class="edge"/><path d="M259.4 194.8L262.4 200L265.4 194.8" class="edge"/><path d="M106 108H150V232H190" class="edge dash"/><path d="M184.8 235L190 232L184.8 229" class="edge"/><text x="156" y="196" class="pred term" text-anchor="start" data-term="spot-check">1 in 5</text><path d="M270 258V276H182V310H200" class="edge"/><path d="M194.8 313L200 310L194.8 307" class="edge"/><rect x="206" y="298" width="89.6" height="24" rx="12" class="badge-shape s-reviewed"/><circle cx="219" cy="310" r="3.5" class="badge-dot s-reviewed"/><text x="228" y="314.3" class="lbl badge-text s-reviewed term" data-term="reviewed">Reviewed</text><text x="208" y="340" class="lbl lbl-xs muted">the source supports it</text><path d="M270 258V276H182V384H200" class="edge"/><path d="M194.8 387L200 384L194.8 381" class="edge"/><rect x="206" y="372" width="132.8" height="24" rx="12" class="badge-shape s-checking"/><circle cx="219" cy="384" r="3.5" class="badge-dot s-checking"/><text x="228" y="388.3" class="lbl badge-text s-checking term" data-term="needs-checking">Needs checking</text><text x="208" y="414" class="lbl lbl-xs muted">could not confirm: a lead</text><path d="M270 258V276H182V458H200" class="edge"/><path d="M194.8 461L200 458L194.8 455" class="edge"/><rect x="206" y="446" width="89.6" height="24" rx="12" class="badge-shape s-rejected"/><circle cx="219" cy="458" r="3.5" class="badge-dot s-rejected"/><text x="228" y="462.3" class="lbl badge-text s-rejected term" data-term="rejected">Rejected</text><text x="208" y="488" class="lbl lbl-xs muted">hidden from search,</text><text x="208" y="502" class="lbl lbl-xs muted">reason kept</text><line x1="50" y1="166" x2="50" y2="292" class="edge"/><path d="M47 286.8L50 292L53 286.8" class="edge"/><rect x="16" y="298" width="68" height="24" rx="12" class="badge-shape s-added"/><circle cx="29" cy="310" r="3.5" class="badge-dot s-added"/><text x="38" y="314.3" class="lbl badge-text s-added term" data-term="added">Added</text><text x="18" y="340" class="lbl lbl-xs muted">not sampled:</text><text x="18" y="354" class="lbl lbl-xs muted">stays Added</text><line x1="16" y1="540" x2="344" y2="540" class="edge dash faint"/><text x="16" y="564" class="lbl lbl-sm term" data-term="imported-draft">Imported draft (seed)</text><text x="16" y="582" class="lbl lbl-xs muted">source-backed, never shown as reviewed</text></svg>
