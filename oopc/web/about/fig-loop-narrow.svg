<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="group" class="fig fig-loop"><title>The loop</title><desc>The loop. Ask (you), Answer (the research agent), Save (findings and source notes), Review (a separate reviewer) and Reuse (the next question) form a ring around saved knowledge: Save writes into it, the reviewer labels it, and Answer reads it first. An outer loop carries each answer's open questions back to Ask, so the loop can ask them itself. Measure sits outside and runs on demand.</desc><path d="M194.5 107A104 104 0 0 1 273.5 164.4" class="edge ring"/><path d="M268.5 161.1L273.5 164.4L273.9 158.4" class="edge ring"/><path d="M282.4 191.9A104 104 0 0 1 252.2 284.8" class="edge ring"/><path d="M253.9 279L252.2 284.8L258.1 283.4" class="edge ring"/><path d="M228.8 301.8A104 104 0 0 1 131.2 301.8" class="edge ring"/><path d="M137.2 301.6L131.2 301.8L134.4 306.9" class="edge ring"/><path d="M107.8 284.8A104 104 0 0 1 77.6 191.9" class="edge ring"/><path d="M79.6 197.6L77.6 191.9L73.7 196.5" class="edge ring"/><path d="M86.5 164.4A104 104 0 0 1 165.5 107" class="edge ring"/><path d="M160.8 110.7L165.5 107L160 104.8" class="edge ring"/><path d="M285.9 166.9Q315.2 164.2 301.2 140A140 140 0 0 0 232.4 80.2Q210.2 71.2 193 102" class="edge dash outer-arc"/><path d="M192.9 96L193 102L198.2 98.9" class="edge outer-arc"/><text x="350" y="68" class="pred term" text-anchor="end" data-term="research-queue">open questions</text><circle cx="180" cy="210" r="40" class="store"/><circle cx="191.5" cy="210" r="3.4" class="fdot s-reviewed"/><circle cx="168.6" cy="219.4" r="3.4" class="fdot s-reviewed"/><circle cx="181.6" cy="193.6" r="3.4" class="fdot s-checking"/><circle cx="192.5" cy="224.6" r="3.4" class="fdot s-added"/><circle cx="157.9" cy="206.5" r="3.4" class="fdot s-checking"/><circle cx="200.4" cy="198.3" r="3.4" class="fdot s-reviewed"/><circle cx="173.3" cy="232.4" r="3.4" class="fdot s-reviewed"/><circle cx="167.5" cy="188.3" r="3.4" class="fdot s-added"/><circle cx="206.9" cy="218.8" r="3.4" class="fdot s-reviewed"/><circle cx="152.4" cy="220.3" r="3.4" class="fdot s-added"/><circle cx="193.2" cy="184.6" r="3.4" class="fdot s-reviewed"/><circle cx="189.7" cy="237.7" r="3.4" class="fdot s-added"/><circle cx="151.1" cy="194.9" r="3.4" class="fdot s-reviewed"/><circle cx="213.7" cy="203.3" r="3.4" class="fdot s-added"/><text x="180" y="158" class="lbl lbl-strong" text-anchor="middle">Saved knowledge</text><line x1="232.3" y1="282" x2="208.8" y2="249.6" class="edge spoke-accent"/><path d="M214.3 252.1L208.8 249.6L209.4 255.6" class="edge spoke-accent"/><line x1="127.7" y1="282" x2="151.2" y2="249.6" class="edge"/><path d="M150.6 255.6L151.2 249.6L145.7 252.1" class="edge"/><line x1="226.6" y1="194.9" x2="264.6" y2="182.5" class="edge spoke-accent"/><path d="M260.6 187L264.6 182.5L258.8 181.3" class="edge spoke-accent"/><circle cx="180" cy="106" r="7" class="step"/><text x="180" y="82" class="lbl step-name" text-anchor="middle">Ask</text><circle cx="278.9" cy="177.9" r="7" class="step"/><text x="292.9" y="182.9" class="lbl step-name" text-anchor="start">Answer</text><circle cx="241.1" cy="294.1" r="7" class="step"/><text x="251.1" y="320.1" class="lbl step-name" text-anchor="start">Save</text><circle cx="118.9" cy="294.1" r="7" class="step"/><text x="108.9" y="320.1" class="lbl step-name" text-anchor="end">Review</text><circle cx="81.1" cy="177.9" r="7" class="step"/><text x="67.1" y="182.9" class="lbl step-name" text-anchor="end">Reuse</text><path d="M320 361Q331 294.9 284.9 192.9" class="edge dash"/><path d="M289.8 196.4L284.9 192.9L284.3 198.8" class="edge"/><circle cx="325" cy="372" r="6" class="step step-satellite"/><text x="325" y="398" class="lbl step-name step-minor" text-anchor="middle">Measure</text><text x="325" y="414" class="lbl lbl-sm muted term" text-anchor="middle" data-term="parity-set">on demand</text></svg>
