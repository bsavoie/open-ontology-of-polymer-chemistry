<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" role="group" class="fig"><title>Who vouches for a fact</title><desc>A new finding is either added, when the research agent read it directly in the source, or marked needs checking, when it was unsure or the excerpt lacks the number. A reviewer opens the source for every finding that needs checking and for a one-in-five sample of added ones, and labels each reviewed, needs checking (could not confirm) or rejected (hidden from search, with the reason kept). Added findings that are not sampled stay added. Imported seed content is a separate lane: source-backed, never shown as reviewed.</desc><rect x="0" y="120" width="132" height="36" rx="18" class="card"/><text x="66" y="143" class="lbl lbl-strong term" text-anchor="middle" data-term="finding">New finding</text><path d="M132 138H162V74H214" class="edge"/><path d="M208.8 77L214 74L208.8 71" class="edge"/><path d="M162 138V204H214" class="edge"/><path d="M208.8 207L214 204L208.8 201" class="edge"/><rect x="222" y="62" width="68" height="24" rx="12" class="badge-shape s-added"/><circle cx="235" cy="74" r="3.5" class="badge-dot s-added"/><text x="244" y="78.3" class="lbl badge-text s-added term" data-term="added">Added</text><text x="224" y="104" class="lbl lbl-xs muted">read directly in the source</text><rect x="222" y="192" width="132.8" height="24" rx="12" class="badge-shape s-checking"/><circle cx="235" cy="204" r="3.5" class="badge-dot s-checking"/><text x="244" y="208.3" class="lbl badge-text s-checking term" data-term="needs-checking">Needs checking</text><text x="224" y="234" class="lbl lbl-xs muted">unsure, or the excerpt</text><text x="224" y="248" class="lbl lbl-xs muted">lacks the number</text><rect x="470" y="112" width="132" height="52" rx="10" class="card"/><text x="536" y="135" class="lbl lbl-strong term" text-anchor="middle" data-term="reviewer">Reviewer</text><text x="536" y="152" class="lbl lbl-xs muted" text-anchor="middle">opens the source</text><path d="M362.8 204H430V150H464" class="edge"/><path d="M458.8 153L464 150L458.8 147" class="edge"/><path d="M298 74H404" class="edge"/><path d="M404 74V30H690" class="edge"/><path d="M684.8 33L690 30L684.8 27" class="edge"/><path d="M404 74H430V126H464" class="edge dash"/><path d="M458.8 129L464 126L458.8 123" class="edge"/><text x="438" y="102" class="pred term" text-anchor="start" data-term="spot-check">1 in 5</text><rect x="700" y="18" width="68" height="24" rx="12" class="badge-shape s-added"/><circle cx="713" cy="30" r="3.5" class="badge-dot s-added"/><text x="722" y="34.3" class="lbl badge-text s-added term" data-term="added">Added</text><text x="702" y="60" class="lbl lbl-xs muted">not sampled: stays Added</text><path d="M602 138H650V108H690" class="edge"/><path d="M684.8 111L690 108L684.8 105" class="edge"/><rect x="700" y="96" width="89.6" height="24" rx="12" class="badge-shape s-reviewed"/><circle cx="713" cy="108" r="3.5" class="badge-dot s-reviewed"/><text x="722" y="112.3" class="lbl badge-text s-reviewed term" data-term="reviewed">Reviewed</text><text x="702" y="138" class="lbl lbl-xs muted">the source supports it</text><path d="M602 138H650V176H690" class="edge"/><path d="M684.8 179L690 176L684.8 173" class="edge"/><rect x="700" y="164" width="132.8" height="24" rx="12" class="badge-shape s-checking"/><circle cx="713" cy="176" r="3.5" class="badge-dot s-checking"/><text x="722" y="180.3" class="lbl badge-text s-checking term" data-term="needs-checking">Needs checking</text><text x="702" y="206" class="lbl lbl-xs muted">could not confirm: a lead</text><path d="M602 138H650V244H690" class="edge"/><path d="M684.8 247L690 244L684.8 241" class="edge"/><rect x="700" y="232" width="89.6" height="24" rx="12" class="badge-shape s-rejected"/><circle cx="713" cy="244" r="3.5" class="badge-dot s-rejected"/><text x="722" y="248.3" class="lbl badge-text s-rejected term" data-term="rejected">Rejected</text><text x="702" y="274" class="lbl lbl-xs muted">hidden from search, reason kept</text><line x1="0" y1="290" x2="880" y2="290" class="edge dash faint"/><text x="0" y="312" class="lbl lbl-sm term" data-term="imported-draft">Imported draft (seed)</text><text x="154" y="312" class="lbl lbl-xs muted">source-backed, never shown as reviewed</text></svg>
