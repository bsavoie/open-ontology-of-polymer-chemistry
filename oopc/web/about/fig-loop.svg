<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" role="group" class="fig fig-loop"><title>The loop</title><desc>The loop. Ask (you), Answer (the research agent), Save (findings and source notes), Review (a separate reviewer) and Reuse (the next question) form a ring around saved knowledge: Save writes into it, the reviewer labels it, and Answer reads it first. An outer loop carries each answer's open questions back to Ask, so the loop can ask them itself. Measure sits outside and runs on demand.</desc><path d="M320.9 141.5A150 150 0 0 1 434.8 224.2" class="edge ring"/><path d="M429.8 220.9L434.8 224.2L435.2 218.3" class="edge ring"/><path d="M447.7 264A150 150 0 0 1 404.2 397.9" class="edge ring"/><path d="M405.9 392.1L404.2 397.9L410 396.4" class="edge ring"/><path d="M370.4 422.4A150 150 0 0 1 229.6 422.4" class="edge ring"/><path d="M235.6 422.2L229.6 422.4L232.8 427.5" class="edge ring"/><path d="M195.8 397.9A150 150 0 0 1 152.3 264" class="edge ring"/><path d="M154.3 269.6L152.3 264L148.4 268.5" class="edge ring"/><path d="M165.2 224.2A150 150 0 0 1 279.1 141.5" class="edge ring"/><path d="M274.4 145.2L279.1 141.5L273.6 139.2" class="edge ring"/><path d="M449.7 232.6Q493.3 219 480.1 194.2A204 204 0 0 0 369.8 98.3Q347.2 90.1 313 136" class="edge dash outer-arc"/><path d="M313.7 130L313 136L318.5 133.6" class="edge outer-arc"/><text x="406.1" y="90.5" class="pred term" text-anchor="start" data-term="research-queue">open questions</text><text x="406.1" y="106.5" class="lbl lbl-xs muted" text-anchor="start">the loop can ask itself</text><circle cx="300" cy="290" r="58" class="store"/><circle cx="312.8" cy="290" r="4.2" class="fdot s-checking"/><circle cx="286.9" cy="300.8" r="4.2" class="fdot s-added"/><circle cx="301.9" cy="271" r="4.2" class="fdot s-added"/><circle cx="314.6" cy="307.1" r="4.2" class="fdot s-checking"/><circle cx="274.1" cy="285.9" r="4.2" class="fdot s-reviewed"/><circle cx="324" cy="276.2" r="4.2" class="fdot s-added"/><circle cx="292.1" cy="316.5" r="4.2" class="fdot s-reviewed"/><circle cx="285.1" cy="264.2" r="4.2" class="fdot s-reviewed"/><circle cx="331.9" cy="300.5" r="4.2" class="fdot s-reviewed"/><circle cx="267.1" cy="302.2" r="4.2" class="fdot s-added"/><circle cx="315.7" cy="259.8" r="4.2" class="fdot s-reviewed"/><circle cx="311.5" cy="323.1" r="4.2" class="fdot s-reviewed"/><circle cx="265.5" cy="272" r="4.2" class="fdot s-reviewed"/><circle cx="340.3" cy="282" r="4.2" class="fdot s-added"/><circle cx="275.5" cy="321.3" r="4.2" class="fdot s-reviewed"/><circle cx="294.4" cy="250.9" r="4.2" class="fdot s-reviewed"/><circle cx="334.4" cy="316.1" r="4.2" class="fdot s-added"/><circle cx="253.9" cy="291.7" r="4.2" class="fdot s-reviewed"/><circle cx="333.5" cy="260" r="4.2" class="fdot s-added"/><circle cx="297.8" cy="333.5" r="4.2" class="fdot s-reviewed"/><circle cx="268.3" cy="255.8" r="4.2" class="fdot s-reviewed"/><circle cx="350" cy="296.1" r="4.2" class="fdot s-added"/><text x="300" y="220" class="lbl lbl-strong" text-anchor="middle">Saved knowledge</text><line x1="379.4" y1="399.2" x2="339.4" y2="344.2" class="edge spoke-accent"/><path d="M344.9 346.6L339.4 344.2L340 350.2" class="edge spoke-accent"/><text x="369.4" y="373.7" class="pred" text-anchor="start">saves</text><line x1="220.6" y1="399.2" x2="260.6" y2="344.2" class="edge"/><path d="M260 350.2L260.6 344.2L255.1 346.6" class="edge"/><text x="230.6" y="373.7" class="pred" text-anchor="end">labels</text><line x1="363.7" y1="269.3" x2="428.4" y2="248.3" class="edge spoke-accent"/><path d="M424.4 252.7L428.4 248.3L422.5 247" class="edge spoke-accent"/><text x="400.1" y="280.8" class="pred term" text-anchor="middle" data-term="knowledge-search">read first</text><circle cx="300" cy="140" r="8" class="step"/><text x="300" y="96" class="lbl step-name" text-anchor="middle">Ask</text><text x="300" y="113" class="lbl lbl-sm muted" text-anchor="middle">you</text><circle cx="442.7" cy="243.6" r="8" class="step"/><text x="460.7" y=