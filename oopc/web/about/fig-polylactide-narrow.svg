<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 648" role="group" class="fig"><title>Polylactide in the graph</title><desc>The polylactide family, wop-000217, in the seed graph. It has two narrower members, poly(L-lactide) and poly(lactide-co-glycolide). It has a structure, the poly-L-lactide repeat unit, through a claim whose evidence is ChEBI entry 53408. It has a process, a catalyst- or initiator-controlled bulk or solution route, and facets including bio based, biodegradable and thermoplastic.</desc><line x1="30" y1="62" x2="30" y2="584" class="edge"/><circle cx="30" cy="40" r="20" class="n-concept n-main"/><text x="60" y="38" class="lbl lbl-strong" text-anchor="start">Polylactide family</text><text x="60" y="54" class="mono term" text-anchor="start" data-term="identifier">wop-000217</text><text x="30" y="44.5" class="lbl lbl-node" text-anchor="middle">PLA</text><line x1="30" y1="112" x2="134" y2="112" class="edge"/><path d="M128.8 115L134 112L128.8 109" class="edge"/><text x="42" y="105" class="pred term" text-anchor="start" data-term="predicate">narrower</text><circle cx="150" cy="112" r="9" class="n-concept"/><text x="169" y="110" class="lbl lbl-strong" text-anchor="start">Poly(L-lactide)</text><text x="169" y="126" class="mono term" text-anchor="start" data-term="identifier">wop-000218</text><line x1="30" y1="168" x2="134" y2="168" class="edge"/><path d="M128.8 171L134 168L128.8 165" class="edge"/><text x="42" y="161" class="pred term" text-anchor="start" data-term="predicate">narrower</text><circle cx="150" cy="168" r="9" class="n-concept"/><text x="169" y="166" class="lbl lbl-strong" text-anchor="start">Poly(lactide-co-glycolide)</text><text x="169" y="182" class="mono term" text-anchor="start" data-term="identifier">wop-000220</text><line x1="30" y1="262" x2="164" y2="262" class="edge"/><path d="M158.8 265L164 262L158.8 259" class="edge"/><text x="42" y="255" class="pred term" text-anchor="start" data-term="predicate">hasStructure</text><path d="